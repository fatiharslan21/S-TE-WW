<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bizim Hikayemiz</title>
  <meta name="description" content="Sevgiliye özel anı sitesi" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="page">
    <div class="sparkles" aria-hidden="true"></div>

    <section class="hero">
      <p class="eyebrow" id="eyebrow">Our little universe</p>
      <h1 id="title">Bizim Hikayemiz</h1>
      <p class="subtitle" id="subtitle">Her fotoğraf, her cümle, her anı biraz daha “biz”.</p>

      <div class="main-photo-wrap">
        <img id="mainImage" class="main-photo" src="/uploads/main.svg" alt="Ana fotoğraf">
      </div>
    </section>

    <section class="gallery-section" aria-label="Fotoğraf galerisi">
      <h2 id="galleryTitle">Anılarımız</h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="letter-card">
      <h2 id="letterTitle">Sana küçük bir mektup</h2>
      <div class="letter" id="letter"></div>
    </section>

    <section class="timeline-card" id="timelineSection">
      <h2 id="timelineTitle">Minik Zaman Çizelgemiz</h2>
      <div class="timeline" id="timeline"></div>
    </section>

    <footer>
      <span id="footerText">Made with love</span>
      <span class="heart">♥</span>
    </footer>
  </main>

  <script src="/script.js"></script>
</body>
</html>
